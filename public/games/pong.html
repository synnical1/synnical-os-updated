<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Pong Duel — Scramjet Stratus</title>
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #14141c;
    --panel-2: #1a1a24;
    --text: #e4e4e7;
    --muted: #8b8b95;
    --accent: #22c55e;
    --accent-2: #16a34a;
    --danger: #ef4444;
    --border: #23232f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    user-select: none;
    -webkit-user-select: none;
  }
  .wrap {
    width: 100%;
    max-width: 720px;
    padding: 12px 14px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .hud { display: flex; gap: 8px; align-items: center; }
  .pill {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 64px;
    justify-content: center;
  }
  .pill b { color: var(--text); font-weight: 700; font-size: 16px; }
  .pill.player b { color: var(--accent); }
  .pill.ai b { color: var(--danger); }
  .vs { color: var(--muted); font-size: 12px; font-weight: 700; }

  .board-card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.02);
  }
  canvas {
    display: block;
    background: #07070b;
    border-radius: 10px;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 10px;
    border-radius: 10px;
    background: rgba(7,7,11,0.86);
    backdrop-filter: blur(4px);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 26px; letter-spacing: 0.5px; }
  .overlay h2.win { color: var(--accent); }
  .overlay h2.lose { color: var(--danger); }
  .overlay p { margin: 0; color: var(--muted); font-size: 14px; }

  .btn {
    background: var(--accent);
    color: #04130a;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.2s ease, background 0.2s ease;
    box-shadow: 0 6px 18px rgba(34,197,94,0.28);
  }
  .btn:hover { background: #34d36b; }
  .btn:active { transform: translateY(1px); }
  .btn.ghost {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    box-shadow: none;
  }
  .btn.ghost:hover { background: #22222e; }

  .help {
    color: var(--muted);
    font-size: 12.5px;
    text-align: center;
    line-height: 1.5;
  }
  .help kbd {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 1px 6px;
    font-size: 11px;
    color: var(--text);
    font-family: inherit;
  }

  @media (max-width: 480px) {
    .title { font-size: 17px; }
    .pill { padding: 5px 9px; font-size: 12px; min-width: 50px; }
    .pill b { font-size: 14px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title"><span class="dot"></span>Pong Duel</div>
      <div class="hud">
        <div class="pill player">YOU <b id="pScore">0</b></div>
        <div class="vs">VS</div>
        <div class="pill ai">AI <b id="aScore">0</b></div>
      </div>
    </header>

    <div class="board-card">
      <canvas id="game" width="640" height="400"></canvas>
      <div class="overlay show" id="overlay">
        <h2 id="ovTitle">Pong Duel</h2>
        <p id="ovText">First to 7 points wins. Move your paddle with mouse, arrow keys, or touch.</p>
        <button class="btn" id="startBtn">Start Match</button>
      </div>
    </div>

    <div class="help">
      Move: <kbd>Mouse</kbd> · <kbd>↑</kbd><kbd>↓</kbd> · touch-drag &nbsp;·&nbsp; Pause: <kbd>Space</kbd> &nbsp;·&nbsp; First to 7 wins.
    </div>

    <button class="btn ghost" id="restartBtn">Restart Match</button>
  </div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const pScoreEl = document.getElementById("pScore");
  const aScoreEl = document.getElementById("aScore");
  const overlay = document.getElementById("overlay");
  const ovTitle = document.getElementById("ovTitle");
  const ovText = document.getElementById("ovText");
  const startBtn = document.getElementById("startBtn");
  const restartBtn = document.getElementById("restartBtn");

  // Logical playfield (we render in CSS pixels via DPR scaling)
  const W = 640, H = 400;
  const PADDLE_W = 12, PADDLE_H = 78;
  const PADDLE_GAP = 18;
  const BALL_R = 7;
  const WIN_SCORE = 7;
  const AI_MAX_SPEED = 5.6;        // px per frame at 60fps
  const BALL_SPEED_START = 5.0;
  const BALL_SPEED_MAX = 12.0;
  const SPEED_UP = 1.045;          // per paddle hit

  let playerY, aiY, ball, trail, pScore, aScore, running, paused, gameOver, waitServe, serveTimer, winner;
  let keys = { up: false, down: false };

  function reset() {
    playerY = (H - PADDLE_H) / 2;
    aiY = (H - PADDLE_H) / 2;
    pScore = 0; aScore = 0;
    pScoreEl.textContent = "0";
    aScoreEl.textContent = "0";
    gameOver = false;
    winner = null;
    paused = false;
    running = false;
    serveBall(Math.random() < 0.5 ? -1 : 1);
    showOverlay("Pong Duel", "First to 7 points wins. Move your paddle with mouse, arrow keys, or touch.", "Start Match");
    draw();
  }

  function serveBall(dir) {
    // dir: -1 = toward player (left), 1 = toward AI (right)
    ball = {
      x: W / 2,
      y: H / 2 + (Math.random() * 80 - 40),
      vx: BALL_SPEED_START * dir,
      vy: (Math.random() * 2 - 1) * 3.0
    };
    trail = [];
    waitServe = true;
    serveTimer = 60; // ~1s pause before serve
  }

  function showOverlay(title, text, btn, cls) {
    ovTitle.textContent = title;
    ovTitle.className = cls || "";
    ovText.textContent = text;
    startBtn.textContent = btn;
    overlay.classList.add("show");
  }
  function hideOverlay() { overlay.classList.remove("show"); }

  function startGame() {
    if (gameOver) { reset(); }
    hideOverlay();
    running = true;
    paused = false;
    requestAnimationFrame(loop);
  }

  function endMatch(who) {
    running = false;
    gameOver = true;
    winner = who;
    if (who === "player") {
      showOverlay("You Win!", "Final score " + pScore + "–" + aScore + ". Nice reflexes.", "Play Again", "win");
    } else {
      showOverlay("AI Wins", "Final score " + pScore + "–" + aScore + ". Try again?", "Play Again", "lose");
    }
  }

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  function update() {
    // Player paddle: keyboard
    const pSpeed = 7.5;
    if (keys.up) playerY -= pSpeed;
    if (keys.down) playerY += pSpeed;
    playerY = clamp(playerY, 0, H - PADDLE_H);

    // AI paddle: track ball with capped speed and slight imperfection
    const target = ball.y + BALL_R - PADDLE_H / 2;
    const diff = target - aiY;
    // add a small dead zone so AI doesn't jitter
    if (Math.abs(diff) > 4) {
      aiY += clamp(diff, -AI_MAX_SPEED, AI_MAX_SPEED);
    }
    aiY = clamp(aiY, 0, H - PADDLE_H);

    if (waitServe) {
      serveTimer--;
      if (serveTimer <= 0) waitServe = false;
      return; // ball stays still during serve pause
    }

    // Trail
    trail.push({ x: ball.x, y: ball.y });
    if (trail.length > 12) trail.shift();

    ball.x += ball.vx;
    ball.y += ball.vy;

    // Top / bottom wall bounce
    if (ball.y - BALL_R < 0) {
      ball.y = BALL_R;
      ball.vy = -ball.vy;
    } else if (ball.y + BALL_R > H) {
      ball.y = H - BALL_R;
      ball.vy = -ball.vy;
    }

    // Player paddle (left) collision
    const pX = PADDLE_GAP;
    if (ball.vx < 0 &&
        ball.x - BALL_R <= pX + PADDLE_W &&
        ball.x - BALL_R >= pX - 4 &&
        ball.y + BALL_R >= playerY && ball.y - BALL_R <= playerY + PADDLE_H) {
      const rel = (ball.y - (playerY + PADDLE_H / 2)) / (PADDLE_H / 2); // -1..1
      const speed = Math.min(BALL_SPEED_MAX, Math.hypot(ball.vx, ball.vy) * SPEED_UP);
      const angle = rel * (Math.PI / 3); // up to 60deg
      ball.vx = Math.abs(speed * Math.cos(angle));
      ball.vy = speed * Math.sin(angle);
      ball.x = pX + PADDLE_W + BALL_R + 0.5;
    }

    // AI paddle (right) collision
    const aX = W - PADDLE_GAP - PADDLE_W;
    if (ball.vx > 0 &&
        ball.x + BALL_R >= aX &&
        ball.x + BALL_R <= aX + PADDLE_W + 4 &&
        ball.y + BALL_R >= aiY && ball.y - BALL_R <= aiY + PADDLE_H) {
      const rel = (ball.y - (aiY + PADDLE_H / 2)) / (PADDLE_H / 2);
      const speed = Math.min(BALL_SPEED_MAX, Math.hypot(ball.vx, ball.vy) * SPEED_UP);
      const angle = rel * (Math.PI / 3);
      ball.vx = -Math.abs(speed * Math.cos(angle));
      ball.vy = speed * Math.sin(angle);
      ball.x = aX - BALL_R - 0.5;
    }

    // Score
    if (ball.x + BALL_R < 0) {
      // AI scores
      aScore++;
      aScoreEl.textContent = aScore;
      if (aScore >= WIN_SCORE) { endMatch("ai"); return; }
      serveBall(-1);
    } else if (ball.x - BALL_R > W) {
      // Player scores
      pScore++;
      pScoreEl.textContent = pScore;
      if (pScore >= WIN_SCORE) { endMatch("player"); return; }
      serveBall(1);
    }
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    // background
    ctx.fillStyle = "#07070b";
    ctx.fillRect(0, 0, W, H);

    // center dashed line
    ctx.strokeStyle = "rgba(255,255,255,0.12)";
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 12]);
    ctx.beginPath();
    ctx.moveTo(W / 2, 8);
    ctx.lineTo(W / 2, H - 8);
    ctx.stroke();
    ctx.setLineDash([]);

    // center circle
    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, 42, 0, Math.PI * 2);
    ctx.stroke();

    // trail
    for (let i = 0; i < trail.length; i++) {
      const t = trail[i];
      const alpha = (i + 1) / trail.length * 0.35;
      ctx.fillStyle = "rgba(255,255,255," + alpha.toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(t.x, t.y, BALL_R * (0.5 + 0.5 * (i / trail.length)), 0, Math.PI * 2);
      ctx.fill();
    }

    // player paddle (emerald)
    ctx.shadowColor = "rgba(34,197,94,0.7)";
    ctx.shadowBlur = 16;
    ctx.fillStyle = "#22c55e";
    roundRect(PADDLE_GAP, playerY, PADDLE_W, PADDLE_H, 6);
    ctx.fill();
    ctx.shadowBlur = 0;

    // AI paddle (red)
    ctx.shadowColor = "rgba(239,68,68,0.7)";
    ctx.shadowBlur = 16;
    ctx.fillStyle = "#ef4444";
    roundRect(W - PADDLE_GAP - PADDLE_W, aiY, PADDLE_W, PADDLE_H, 6);
    ctx.fill();
    ctx.shadowBlur = 0;

    // ball
    ctx.shadowColor = "rgba(255,255,255,0.8)";
    ctx.shadowBlur = 14;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // serve countdown indicator
    if (waitServe && running && !paused) {
      ctx.fillStyle = "rgba(228,228,231,0.5)";
      ctx.font = "600 14px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Serve...", W / 2, 30);
    }
  }

  let last = 0;
  function loop(now) {
    if (!running) { draw(); return; }
    if (!last) last = now;
    let dt = now - last;
    last = now;
    if (!paused) {
      // Fixed-step update normalized to 60fps
      const steps = Math.min(4, Math.max(1, Math.round(dt / (1000 / 60))));
      for (let i = 0; i < steps; i++) {
        update();
        if (!running) break;
      }
    }
    draw();
    if (running && !paused) requestAnimationFrame(loop);
    else last = 0;
  }

  // Input: mouse + touch drag (pointer) controlling player paddle Y
  function pointerToPaddle(clientY) {
    const rect = canvas.getBoundingClientRect();
    const y = (clientY - rect.top) * (H / rect.height);
    playerY = clamp(y - PADDLE_H / 2, 0, H - PADDLE_H);
  }
  canvas.addEventListener("pointermove", function (e) {
    if (e.pointerType === "touch") return; // handled by touch handlers
    pointerToPaddle(e.clientY);
  });
  canvas.addEventListener("pointerdown", function (e) {
    if (e.pointerType !== "touch") pointerToPaddle(e.clientY);
  });
  // touch-drag (explicit so it doesn't scroll)
  canvas.addEventListener("touchstart", function (e) {
    if (e.touches.length) pointerToPaddle(e.touches[0].clientY);
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener("touchmove", function (e) {
    if (e.touches.length) pointerToPaddle(e.touches[0].clientY);
    e.preventDefault();
  }, { passive: false });

  // Keyboard
  window.addEventListener("keydown", function (e) {
    const k = e.key.toLowerCase();
    if (k === "arrowup" || k === "arrowdown" || k === " " || k === "w" || k === "s") e.preventDefault();
    if (k === "arrowup" || k === "w") keys.up = true;
    else if (k === "arrowdown" || k === "s") keys.down = true;
    else if (k === " ") {
      if (running && !gameOver) {
        paused = !paused;
        if (paused) showOverlay("Paused", "Press Space or tap Resume.", "Resume");
        else { hideOverlay(); last = 0; requestAnimationFrame(loop); }
      }
    }
  }, { passive: false });
  window.addEventListener("keyup", function (e) {
    const k = e.key.toLowerCase();
    if (k === "arrowup" || k === "w") keys.up = false;
    else if (k === "arrowdown" || k === "s") keys.down = false;
  });

  startBtn.addEventListener("click", function () {
    if (paused && !gameOver) { hideOverlay(); paused = false; last = 0; requestAnimationFrame(loop); }
    else startGame();
  });
  restartBtn.addEventListener("click", function () {
    reset();
    startGame();
  });

  // Responsive sizing
  function resize() {
    const availW = Math.min(window.innerWidth - 28, 700);
    const availH = window.innerHeight - 220;
    const ratio = W / H;
    let w = availW;
    let h = w / ratio;
    if (h > availH) { h = Math.max(220, availH); w = h * ratio; }
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = Math.round(w) + "px";
    canvas.style.height = Math.round(h) + "px";
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  window.addEventListener("resize", resize);

  reset();
  resize();
})();
</script>
</body>
</html>
