<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Tetris — Scramjet Stratus</title>
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #14141c;
    --panel-2: #1a1a24;
    --text: #e4e4e7;
    --muted: #8b8b95;
    --accent: #22c55e;
    --accent-2: #16a34a;
    --danger: #ef4444;
    --border: #23232f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    user-select: none;
    -webkit-user-select: none;
  }
  .wrap {
    width: 100%;
    max-width: 640px;
    padding: 12px 14px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }
  .hud { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .pill {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    min-width: 56px;
  }
  .pill .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; display: block; }
  .pill b { color: var(--text); font-size: 16px; font-weight: 700; display: block; line-height: 1.1; }
  .pill.accent b { color: var(--accent); }

  .stage {
    display: flex;
    gap: 12px;
    align-items: stretch;
    justify-content: center;
  }
  .board-card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  canvas#game {
    display: block;
    background: #07070b;
    border-radius: 8px;
    touch-action: none;
  }
  .side {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 120px;
  }
  .side .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
  }
  .side .panel .lbl {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.7px;
    margin-bottom: 6px;
  }
  canvas#next {
    display: block;
    background: var(--panel-2);
    border-radius: 8px;
    width: 100%;
    height: 100px;
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .controls button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 16px;
    padding: 12px 0;
    cursor: pointer;
    transition: background 0.12s ease, transform 0.08s ease;
    touch-action: none;
  }
  .controls button:active { background: var(--accent-2); color: #04130a; transform: scale(0.96); }
  .controls .wider { grid-column: span 3; padding: 10px 0; font-size: 13px; font-weight: 700; }
  .controls .span2 { grid-column: span 2; }

  .overlay {
    position: absolute;
    inset: 8px;
    border-radius: 8px;
    background: rgba(7,7,11,0.88);
    backdrop-filter: blur(4px);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 16px;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 22px; }
  .overlay h2.over { color: var(--danger); }
  .overlay p { margin: 0; color: var(--muted); font-size: 13px; }

  .btn {
    background: var(--accent);
    color: #04130a;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.2s ease;
    box-shadow: 0 6px 18px rgba(34,197,94,0.28);
  }
  .btn:hover { background: #34d36b; }
  .btn:active { transform: translateY(1px); }
  .btn.ghost {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    box-shadow: none;
  }
  .btn.ghost:hover { background: #22222e; }

  .help {
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    line-height: 1.5;
  }
  .help kbd {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 1px 6px;
    font-size: 11px;
    color: var(--text);
    font-family: inherit;
  }

  @media (max-width: 480px) {
    .stage { flex-direction: column; align-items: center; }
    .side { width: 100%; flex-direction: row; flex-wrap: wrap; }
    .side .panel { flex: 1 1 120px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title"><span class="dot"></span>Tetris</div>
      <div class="hud">
        <div class="pill"><span class="lbl">Score</span><b id="score">0</b></div>
        <div class="pill accent"><span class="lbl">Level</span><b id="level">1</b></div>
        <div class="pill"><span class="lbl">Lines</span><b id="lines">0</b></div>
      </div>
    </header>

    <div class="stage">
      <div class="board-card">
        <canvas id="game" width="240" height="480"></canvas>
        <div class="overlay show" id="overlay">
          <h2 id="ovTitle">Tetris</h2>
          <p id="ovText">Stack blocks, clear lines, survive.</p>
          <button class="btn" id="startBtn">Start Game</button>
        </div>
      </div>
      <div class="side">
        <div class="panel">
          <div class="lbl">Next</div>
          <canvas id="next" width="120" height="100"></canvas>
        </div>
        <div class="panel">
          <div class="lbl">Controls</div>
          <div class="controls">
            <button data-act="rotate" aria-label="Rotate">⟳</button>
            <button data-act="up" style="visibility:hidden" tabindex="-1"></button>
            <button data-act="hold-note" style="visibility:hidden" tabindex="-1"></button>
            <button data-act="left" aria-label="Left">◀</button>
            <button data-act="down" aria-label="Down">▼</button>
            <button data-act="right" aria-label="Right">▶</button>
            <button data-act="drop" class="wider">Hard Drop</button>
          </div>
        </div>
      </div>
    </div>

    <div class="help">
      <kbd>←</kbd><kbd>→</kbd> move · <kbd>↑</kbd> rotate · <kbd>↓</kbd> soft drop · <kbd>Space</kbd> hard drop · <kbd>P</kbd> pause
    </div>

    <button class="btn ghost" id="restartBtn">New Game</button>
  </div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const nextCanvas = document.getElementById("next");
  const nctx = nextCanvas.getContext("2d");

  const scoreEl = document.getElementById("score");
  const levelEl = document.getElementById("level");
  const linesEl = document.getElementById("lines");
  const overlay = document.getElementById("overlay");
  const ovTitle = document.getElementById("ovTitle");
  const ovText = document.getElementById("ovText");
  const startBtn = document.getElementById("startBtn");
  const restartBtn = document.getElementById("restartBtn");

  // Logical dimensions
  const COLS = 10;
  const ROWS = 20;
  const CELL = 24; // logical pixel per cell
  const W = COLS * CELL; // 240
  const H = ROWS * CELL; // 480

  // Tetromino definitions: list of [x,y] cells in spawn orientation, plus color, plus bounding size for rotation
  const PIECES = {
    I: { color: "#06b6d4", size: 4, cells: [[0,1],[1,1],[2,1],[3,1]] },
    O: { color: "#fbbf24", size: 2, cells: [[0,0],[1,0],[0,1],[1,1]] },
    T: { color: "#a855f7", size: 3, cells: [[0,1],[1,1],[2,1],[1,0]] },
    S: { color: "#22c55e", size: 3, cells: [[1,0],[2,0],[0,1],[1,1]] },
    Z: { color: "#ef4444", size: 3, cells: [[0,0],[1,0],[1,1],[2,1]] },
    J: { color: "#3b82f6", size: 3, cells: [[0,0],[0,1],[1,1],[2,1]] },
    L: { color: "#f97316", size: 3, cells: [[2,0],[0,1],[1,1],[2,1]] }
  };
  const TYPES = Object.keys(PIECES);

  // State
  let grid; // 2D array of color string or null
  let cur; // { type, rotation, x, y }
  let nextType;
  let score, level, lines, gameOver, running, paused;
  let dropAcc, dropInterval, lastT, rafId;
  // For lock delay
  let lockTimer, lockResets;

  function emptyGrid() {
    const g = [];
    for (let r = 0; r < ROWS; r++) g.push(new Array(COLS).fill(null));
    return g;
  }

  function rotateCells(cells, size, times) {
    let out = cells.map(c => [c[0], c[1]]);
    for (let i = 0; i < times; i++) {
      out = out.map(([x, y]) => [size - 1 - y, x]);
    }
    return out;
  }

  function pieceCells(p) {
    const def = PIECES[p.type];
    return rotateCells(def.cells, def.size, p.rotation).map(([x, y]) => [p.x + x, p.y + y]);
  }

  function collides(p, dx, dy, drot) {
    const def = PIECES[p.type];
    const rot = ((p.rotation + (drot || 0)) % 4 + 4) % 4;
    const cells = rotateCells(def.cells, def.size, rot);
    for (const [cx, cy] of cells) {
      const x = p.x + cx + (dx || 0);
      const y = p.y + cy + (dy || 0);
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && grid[y][x]) return true;
    }
    return false;
  }

  function spawn(type) {
    const def = PIECES[type];
    const startX = Math.floor((COLS - def.size) / 2);
    return { type, rotation: 0, x: startX, y: type === "I" ? -1 : 0 };
  }

  function pickNext() {
    return TYPES[Math.floor(Math.random() * TYPES.length)];
  }

  function reset() {
    grid = emptyGrid();
    score = 0;
    level = 1;
    lines = 0;
    gameOver = false;
    running = false;
    paused = false;
    dropAcc = 0;
    dropInterval = dropMsForLevel(1);
    nextType = pickNext();
    cur = spawn(nextType);
    nextType = pickNext();
    lockTimer = 0;
    lockResets = 0;
    updateHud();
    showOverlay("Tetris", "Stack blocks, clear lines, survive.", "Start Game");
    draw();
    drawNext();
  }

  function dropMsForLevel(lv) {
    return Math.max(60, 800 - (lv - 1) * 65);
  }

  function updateHud() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    linesEl.textContent = lines;
  }

  function showOverlay(title, text, btn, cls) {
    ovTitle.textContent = title;
    ovTitle.className = cls || "";
    ovText.textContent = text;
    startBtn.textContent = btn;
    overlay.classList.add("show");
  }
  function hideOverlay() { overlay.classList.remove("show"); }

  function startGame() {
    if (gameOver) reset();
    hideOverlay();
    running = true;
    paused = false;
    lastT = performance.now();
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  function endGame() {
    running = false;
    gameOver = true;
    showOverlay("Game Over", "Final score: " + score + ". Lines: " + lines + ".", "Play Again", "over");
  }

  function tryMove(dx, dy) {
    if (!collides(cur, dx, dy, 0)) {
      cur.x += dx;
      cur.y += dy;
      // Reset lock timer if resting
      if (isResting()) {
        lockTimer = 0;
        if (lockResets < 15) lockResets++;
      }
      return true;
    }
    return false;
  }

  function isResting() {
    return collides(cur, 0, 1, 0);
  }

  function tryRotate() {
    // Simple wall kicks: try 0, -1, +1, -2, +2 on x
    const kicks = [0, -1, 1, -2, 2];
    for (const k of kicks) {
      if (!collides(cur, k, 0, 1)) {
        cur.x += k;
        cur.rotation = ((cur.rotation + 1) % 4 + 4) % 4;
        if (isResting()) {
          lockTimer = 0;
          if (lockResets < 15) lockResets++;
        }
        return true;
      }
    }
    return false;
  }

  function lockPiece() {
    const cells = pieceCells(cur);
    let topOut = false;
    for (const [x, y] of cells) {
      if (y < 0) { topOut = true; continue; }
      grid[y][x] = PIECES[cur.type].color;
    }
    if (topOut) {
      endGame();
      return;
    }
    clearLines();
    cur = spawn(nextType);
    nextType = pickNext();
    lockResets = 0;
    lockTimer = 0;
    if (collides(cur, 0, 0, 0)) {
      endGame();
      return;
    }
    drawNext();
  }

  function clearLines() {
    let cleared = 0;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r].every(c => c !== null)) {
        grid.splice(r, 1);
        grid.unshift(new Array(COLS).fill(null));
        cleared++;
        r++; // recheck this row index
      }
    }
    if (cleared > 0) {
      const points = [0, 100, 300, 500, 800][cleared] * level;
      score += points;
      lines += cleared;
      const newLevel = Math.floor(lines / 10) + 1;
      if (newLevel > level) {
        level = newLevel;
        dropInterval = dropMsForLevel(level);
      }
      updateHud();
    }
  }

  function hardDrop() {
    let dist = 0;
    while (!collides(cur, 0, 1, 0)) {
      cur.y++;
      dist++;
    }
    score += dist * 2;
    updateHud();
    lockPiece();
  }

  function softDrop() {
    if (tryMove(0, 1)) {
      score += 1;
      updateHud();
    }
  }

  function update(dt) {
    if (!running || paused || gameOver) return;
    dropAcc += dt;
    if (dropAcc >= dropInterval) {
      dropAcc -= dropInterval;
      if (!tryMove(0, 1)) {
        // Can't move down — start/continue lock delay
      }
    }
    // Lock delay
    if (isResting()) {
      lockTimer += dt;
      if (lockTimer >= 500) {
        lockPiece();
        lockTimer = 0;
      }
    } else {
      lockTimer = 0;
    }
  }

  // Compute ghost position (where piece would land)
  function ghostOffset() {
    let dy = 0;
    while (!collides(cur, 0, dy + 1, 0)) dy++;
    return dy;
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawCell(c, x, y, color, ghost) {
    const px = x * CELL;
    const py = y * CELL;
    if (ghost) {
      c.strokeStyle = color;
      c.globalAlpha = 0.45;
      c.lineWidth = 2;
      roundRect(px + 2, py + 2, CELL - 4, CELL - 4, 3);
      c.stroke();
      c.globalAlpha = 1;
      return;
    }
    c.fillStyle = color;
    roundRect(px + 1, py + 1, CELL - 2, CELL - 2, 3);
    c.fill();
    // top highlight
    c.fillStyle = "rgba(255,255,255,0.22)";
    roundRect(px + 2, py + 2, CELL - 4, 4, 2);
    c.fill();
    // bottom shade
    c.fillStyle = "rgba(0,0,0,0.22)";
    roundRect(px + 2, py + CELL - 6, CELL - 4, 4, 2);
    c.fill();
  }

  function draw() {
    ctx.fillStyle = "#07070b";
    ctx.fillRect(0, 0, W, H);

    // grid lines
    ctx.strokeStyle = "rgba(255,255,255,0.04)";
    ctx.lineWidth = 1;
    for (let x = 1; x < COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, H); ctx.stroke();
    }
    for (let y = 1; y < ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(W, y * CELL); ctx.stroke();
    }

    // locked cells
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (grid[r][c]) drawCell(ctx, c, r, grid[r][c], false);
      }
    }

    if (cur && !gameOver) {
      // ghost
      const dy = ghostOffset();
      const def = PIECES[cur.type];
      const cells = pieceCells(cur);
      for (const [x, y] of cells) {
        const gy = y + dy;
        if (gy >= 0) drawCell(ctx, x, gy, def.color, true);
      }
      // current
      for (const [x, y] of cells) {
        if (y >= 0) drawCell(ctx, x, y, def.color, false);
      }
    }
  }

  function drawNext() {
    nctx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
    nctx.fillStyle = "#1a1a24";
    nctx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
    if (!nextType) return;
    const def = PIECES[nextType];
    const cells = def.cells;
    // Center the piece in the next canvas
    const cs = 20;
    let minX = 99, maxX = -99, minY = 99, maxY = -99;
    for (const [x, y] of cells) {
      minX = Math.min(minX, x); maxX = Math.max(maxX, x);
      minY = Math.min(minY, y); maxY = Math.max(maxY, y);
    }
    const pw = (maxX - minX + 1) * cs;
    const ph = (maxY - minY + 1) * cs;
    const ox = (nextCanvas.width - pw) / 2 - minX * cs;
    const oy = (nextCanvas.height - ph) / 2 - minY * cs;
    for (const [x, y] of cells) {
      const px = ox + x * cs;
      const py = oy + y * cs;
      nctx.fillStyle = def.color;
      nctx.beginPath();
      const r = 3;
      nctx.moveTo(px + 1 + r, py + 1);
      nctx.arcTo(px + 1 + cs - 2, py + 1, px + 1 + cs - 2, py + 1 + cs - 2, r);
      nctx.arcTo(px + 1 + cs - 2, py + 1 + cs - 2, px + 1, py + 1 + cs - 2, r);
      nctx.arcTo(px + 1, py + 1 + cs - 2, px + 1, py + 1, r);
      nctx.arcTo(px + 1, py + 1, px + 1 + cs - 2, py + 1, r);
      nctx.closePath();
      nctx.fill();
      nctx.fillStyle = "rgba(255,255,255,0.22)";
      nctx.fillRect(px + 2, py + 2, cs - 4, 3);
    }
  }

  function loop(now) {
    if (!running) { draw(); return; }
    const dt = Math.min(50, now - lastT);
    lastT = now;
    if (!paused) update(dt);
    draw();
    if (running) rafId = requestAnimationFrame(loop);
  }

  // Input
  window.addEventListener("keydown", function (e) {
    const k = e.key.toLowerCase();
    if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase()) || k === "p") e.preventDefault();
    if (!running) {
      if (k === " " || k === "enter") { if (gameOver) reset(); startGame(); }
      return;
    }
    if (k === "p") {
      paused = !paused;
      if (paused) showOverlay("Paused", "Press P or tap Resume.", "Resume");
      else { hideOverlay(); lastT = performance.now(); rafId = requestAnimationFrame(loop); }
      return;
    }
    if (gameOver) return;
    if (k === "arrowleft") tryMove(-1, 0);
    else if (k === "arrowright") tryMove(1, 0);
    else if (k === "arrowdown") softDrop();
    else if (k === "arrowup") tryRotate();
    else if (k === " ") hardDrop();
  }, { passive: false });

  // Touch controls
  document.querySelector(".controls").addEventListener("click", function (e) {
    const t = e.target.closest("button[data-act]");
    if (!t) return;
    if (!running || gameOver) return;
    const act = t.dataset.act;
    if (act === "left") tryMove(-1, 0);
    else if (act === "right") tryMove(1, 0);
    else if (act === "down") softDrop();
    else if (act === "rotate") tryRotate();
    else if (act === "drop") hardDrop();
  });

  // Tap on canvas to rotate, swipe to move
  let ts = null;
  canvas.addEventListener("touchstart", function (e) {
    if (e.touches.length === 1) ts = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
  }, { passive: true });
  canvas.addEventListener("touchend", function (e) {
    if (!ts || !running || gameOver) { ts = null; return; }
    const t = e.changedTouches[0];
    const dx = t.clientX - ts.x;
    const dy = t.clientY - ts.y;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    const dt = Date.now() - ts.t;
    if (ax < 14 && ay < 14 && dt < 250) {
      tryRotate();
    } else if (ax > ay) {
      tryMove(dx > 0 ? 1 : -1, 0);
    } else {
      if (dy > 30) hardDrop();
      else softDrop();
    }
    ts = null;
  }, { passive: true });

  startBtn.addEventListener("click", function () {
    if (paused) { hideOverlay(); paused = false; lastT = performance.now(); rafId = requestAnimationFrame(loop); }
    else if (gameOver) { reset(); startGame(); }
    else startGame();
  });
  restartBtn.addEventListener("click", function () {
    if (rafId) cancelAnimationFrame(rafId);
    reset();
    startGame();
  });

  // Responsive scaling
  function resize() {
    const maxW = Math.min(window.innerWidth - 28, 360);
    const maxH = window.innerHeight - 230;
    const ratio = W / H;
    let w = maxW;
    let h = w / ratio;
    if (h > maxH) { h = maxH; w = h * ratio; }
    w = Math.max(180, w);
    h = w / ratio;
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  window.addEventListener("resize", resize);

  reset();
  resize();
})();
</script>
</body>
</html>
