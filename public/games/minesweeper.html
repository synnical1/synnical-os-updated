<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Minesweeper Grid — Scramjet Stratus</title>
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #14141c;
    --panel-2: #1a1a24;
    --text: #e4e4e7;
    --muted: #8b8b95;
    --accent: #22c55e;
    --accent-2: #16a34a;
    --danger: #ef4444;
    --border: #23232f;
    /* Classic minesweeper number colors, light variants for dark bg */
    --n1: #60a5fa;  /* blue */
    --n2: #4ade80;  /* green */
    --n3: #f87171;  /* red */
    --n4: #a78bfa;  /* purple */
    --n5: #f59e0b;  /* amber/brown */
    --n6: #22d3ee;  /* cyan */
    --n7: #f472b6;  /* pink */
    --n8: #d4d4d8;  /* white-ish */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    user-select: none;
    -webkit-user-select: none;
  }
  .wrap {
    width: 100%;
    max-width: 560px;
    padding: 12px 14px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .hud { display: flex; gap: 8px; align-items: center; }
  .pill {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .pill b { color: var(--text); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
  .pill.danger b { color: var(--danger); }
  .pill.accent b { color: var(--accent); }

  .board-card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.02);
  }
  #grid {
    display: grid;
    gap: 3px;
    background: #07070b;
    border-radius: 10px;
    padding: 6px;
    touch-action: none;
  }
  .cell {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: linear-gradient(180deg, #20202c, #181822);
    border: 1px solid #2c2c3a;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: clamp(12px, 3.4vw, 18px);
    cursor: pointer;
    color: var(--text);
    transition: background 0.08s ease;
    -webkit-user-select: none;
    user-select: none;
    line-height: 1;
  }
  .cell:hover { background: linear-gradient(180deg, #262633, #1c1c28); }
  .cell.revealed {
    background: #0d0d14;
    border-color: #1a1a24;
    cursor: default;
  }
  .cell.revealed:hover { background: #0d0d14; }
  .cell.flagged {
    background: linear-gradient(180deg, #2a1f0c, #1f1708);
    border-color: #4a3a18;
  }
  .cell.mine.revealed {
    background: #3a0d0d;
    border-color: #5a1414;
  }
  .cell.mine.detonated {
    background: #7a1414;
    border-color: #b02020;
  }
  .cell.n1 { color: var(--n1); }
  .cell.n2 { color: var(--n2); }
  .cell.n3 { color: var(--n3); }
  .cell.n4 { color: var(--n4); }
  .cell.n5 { color: var(--n5); }
  .cell.n6 { color: var(--n6); }
  .cell.n7 { color: var(--n7); }
  .cell.n8 { color: var(--n8); }

  .overlay {
    position: absolute;
    inset: 10px;
    border-radius: 10px;
    background: rgba(7,7,11,0.86);
    backdrop-filter: blur(4px);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 26px; letter-spacing: 0.5px; }
  .overlay h2.win { color: var(--accent); }
  .overlay h2.lose { color: var(--danger); }
  .overlay p { margin: 0; color: var(--muted); font-size: 14px; }

  .btn {
    background: var(--accent);
    color: #04130a;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.2s ease, background 0.2s ease;
    box-shadow: 0 6px 18px rgba(34,197,94,0.28);
  }
  .btn:hover { background: #34d36b; }
  .btn:active { transform: translateY(1px); }
  .btn.ghost {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    box-shadow: none;
  }
  .btn.ghost:hover { background: #22222e; }

  .help {
    color: var(--muted);
    font-size: 12.5px;
    text-align: center;
    line-height: 1.5;
  }
  .help kbd {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 1px 6px;
    font-size: 11px;
    color: var(--text);
    font-family: inherit;
  }

  @media (max-width: 480px) {
    .title { font-size: 17px; }
    .pill { padding: 5px 9px; font-size: 12px; }
    .pill b { font-size: 14px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title"><span class="dot"></span>Minesweeper Grid</div>
      <div class="hud">
        <div class="pill danger">⚑ <b id="mineCount">20</b></div>
        <div class="pill accent">⏱ <b id="timer">0</b></div>
      </div>
    </header>

    <div class="board-card">
      <div id="grid"></div>
      <div class="overlay show" id="overlay">
        <h2 id="ovTitle">Minesweeper Grid</h2>
        <p id="ovText">Clear all safe cells. Flag the mines. 12×12 grid, 20 mines.</p>
        <button class="btn" id="startBtn">Start</button>
      </div>
    </div>

    <div class="help">
      Left-click reveal · Right-click or long-press to flag · First click is always safe.
    </div>

    <button class="btn ghost" id="restartBtn">New Game</button>
  </div>

<script>
(function () {
  "use strict";

  const COLS = 12, ROWS = 12, MINES = 20;
  const gridEl = document.getElementById("grid");
  const mineCountEl = document.getElementById("mineCount");
  const timerEl = document.getElementById("timer");
  const overlay = document.getElementById("overlay");
  const ovTitle = document.getElementById("ovTitle");
  const ovText = document.getElementById("ovText");
  const startBtn = document.getElementById("startBtn");
  const restartBtn = document.getElementById("restartBtn");

  let cells, minesPlaced, flagsPlaced, revealedCount, started, gameOver, won, timerSec, timerInterval;
  let firstClick = true;

  function reset() {
    cells = [];
    minesPlaced = false;
    flagsPlaced = 0;
    revealedCount = 0;
    firstClick = true;
    started = false;
    gameOver = false;
    won = false;
    timerSec = 0;
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    timerEl.textContent = "0";
    mineCountEl.textContent = String(MINES);
    gridEl.style.gridTemplateColumns = "repeat(" + COLS + ", 1fr)";
    gridEl.innerHTML = "";
    for (let r = 0; r < ROWS; r++) {
      const row = [];
      for (let c = 0; c < COLS; c++) {
        const el = document.createElement("div");
        el.className = "cell";
        el.dataset.r = r;
        el.dataset.c = c;
        gridEl.appendChild(el);
        row.push({ el, mine: false, revealed: false, flagged: false, adj: 0 });
      }
      cells.push(row);
    }
    showOverlay("Minesweeper Grid", "Clear all safe cells. Flag the mines. 12×12 grid, 20 mines.", "Start");
  }

  function showOverlay(title, text, btn, cls) {
    ovTitle.textContent = title;
    ovTitle.className = cls || "";
    ovText.textContent = text;
    startBtn.textContent = btn;
    overlay.classList.add("show");
  }
  function hideOverlay() { overlay.classList.remove("show"); }

  function startGame() {
    if (gameOver) reset();
    hideOverlay();
    started = true; // user dismissed intro; timer starts on first cell reveal
  }

  function startTimer() {
    if (timerInterval) return;
    timerInterval = setInterval(function () {
      if (!gameOver && started) {
        timerSec++;
        timerEl.textContent = String(timerSec);
      }
    }, 1000);
  }

  function inBounds(r, c) { return r >= 0 && r < ROWS && c >= 0 && c < COLS; }

  function placeMines(safeR, safeC) {
    const safe = new Set();
    // first click + 8 neighbors guaranteed safe
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        const r = safeR + dr, c = safeC + dc;
        if (inBounds(r, c)) safe.add(r * COLS + c);
      }
    }
    let placed = 0;
    while (placed < MINES) {
      const idx = Math.floor(Math.random() * ROWS * COLS);
      if (safe.has(idx)) continue;
      const r = Math.floor(idx / COLS), c = idx % COLS;
      if (cells[r][c].mine) continue;
      cells[r][c].mine = true;
      placed++;
    }
    // compute adjacency
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (cells[r][c].mine) continue;
        let n = 0;
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (!dr && !dc) continue;
            const nr = r + dr, nc = c + dc;
            if (inBounds(nr, nc) && cells[nr][nc].mine) n++;
          }
        }
        cells[r][c].adj = n;
      }
    }
    minesPlaced = true;
  }

  function revealCell(r, c) {
    if (!inBounds(r, c)) return;
    const cell = cells[r][c];
    if (cell.revealed || cell.flagged) return;
    cell.revealed = true;
    cell.el.classList.add("revealed");
    revealedCount++;
    if (cell.mine) {
      cell.el.classList.add("detonated");
      cell.el.textContent = "💣";
      loseGame();
      return;
    }
    if (cell.adj > 0) {
      cell.el.classList.add("n" + cell.adj);
      cell.el.textContent = String(cell.adj);
    } else {
      // flood-fill neighbors
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (!dr && !dc) continue;
          revealCell(r + dr, c + dc);
        }
      }
    }
    checkWin();
  }

  function toggleFlag(r, c) {
    if (gameOver) return;
    const cell = cells[r][c];
    if (cell.revealed) return;
    cell.flagged = !cell.flagged;
    if (cell.flagged) {
      cell.el.classList.add("flagged");
      cell.el.textContent = "🚩";
      flagsPlaced++;
    } else {
      cell.el.classList.remove("flagged");
      cell.el.textContent = "";
      flagsPlaced--;
    }
    mineCountEl.textContent = String(MINES - flagsPlaced);
  }

  function revealAllMines() {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = cells[r][c];
        if (cell.mine && !cell.revealed) {
          cell.revealed = true;
          cell.el.classList.add("revealed", "mine");
          cell.el.textContent = "💣";
        }
      }
    }
  }

  function checkWin() {
    const totalSafe = ROWS * COLS - MINES;
    if (revealedCount >= totalSafe && !gameOver) {
      won = true;
      gameOver = true;
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      // auto-flag remaining mines visually
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (cells[r][c].mine && !cells[r][c].flagged) {
            cells[r][c].flagged = true;
            cells[r][c].el.classList.add("flagged");
            cells[r][c].el.textContent = "🚩";
          }
        }
      }
      mineCountEl.textContent = "0";
      showOverlay("You Win!", "Cleared in " + timerSec + "s. All safe cells revealed.", "Play Again", "win");
    }
  }

  function loseGame() {
    gameOver = true;
    won = false;
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    revealAllMines();
    showOverlay("Boom!", "You hit a mine. Time: " + timerSec + "s.", "Try Again", "lose");
  }

  function handleClick(r, c) {
    if (gameOver) return;
    if (!started) startGame();
    if (firstClick) {
      placeMines(r, c);
      firstClick = false;
      startTimer();
    }
    const cell = cells[r][c];
    if (cell.flagged) return;
    // chord: if revealed number cell with matching flag count, reveal neighbors
    if (cell.revealed && cell.adj > 0) {
      let flagN = 0;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (!dr && !dc) continue;
          const nr = r + dr, nc = c + dc;
          if (inBounds(nr, nc) && cells[nr][nc].flagged) flagN++;
        }
      }
      if (flagN === cell.adj) {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (!dr && !dc) continue;
            const nr = r + dr, nc = c + dc;
            if (inBounds(nr, nc) && !cells[nr][nc].flagged && !cells[nr][nc].revealed) {
              revealCell(nr, nc);
              if (gameOver) return;
            }
          }
        }
      }
      return;
    }
    if (cell.revealed) return;
    revealCell(r, c);
  }

  // Long-press handling for mobile flag
  let longPressTimer = null;
  let longPressTriggered = false;
  let lpR = -1, lpC = -1;

  function startLongPress(r, c) {
    longPressTriggered = false;
    lpR = r; lpC = c;
    longPressTimer = setTimeout(function () {
      longPressTriggered = true;
      toggleFlag(r, c);
      if (navigator.vibrate) navigator.vibrate(15);
    }, 350);
  }
  function cancelLongPress() {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  }

  gridEl.addEventListener("contextmenu", function (e) {
    e.preventDefault();
    const t = e.target.closest(".cell");
    if (!t) return;
    const r = +t.dataset.r, c = +t.dataset.c;
    toggleFlag(r, c);
  });

  gridEl.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    const t = e.target.closest(".cell");
    if (!t) return;
    const r = +t.dataset.r, c = +t.dataset.c;
    if (e.pointerType === "touch") {
      startLongPress(r, c);
    }
  });
  gridEl.addEventListener("pointerup", function (e) {
    const t = e.target.closest(".cell");
    if (!t) { cancelLongPress(); return; }
    const r = +t.dataset.r, c = +t.dataset.c;
    if (e.pointerType === "touch") {
      cancelLongPress();
      if (!longPressTriggered) {
        // treat as reveal
        handleClick(r, c);
      }
      longPressTriggered = false;
    } else if (e.button === 0) {
      handleClick(r, c);
    }
  });
  gridEl.addEventListener("pointerleave", function () { cancelLongPress(); });
  gridEl.addEventListener("pointercancel", function () { cancelLongPress(); });

  startBtn.addEventListener("click", function () {
    if (gameOver) { reset(); startGame(); }
    else startGame();
  });
  restartBtn.addEventListener("click", function () {
    reset();
    startGame();
  });

  // Responsive grid sizing
  function resize() {
    const availW = Math.min(window.innerWidth - 28, 520);
    const availH = window.innerHeight - 220;
    const size = Math.max(240, Math.min(availW, availH, 520));
    gridEl.style.width = size + "px";
    gridEl.style.height = size + "px";
  }
  window.addEventListener("resize", resize);

  reset();
  resize();
})();
</script>
</body>
</html>
