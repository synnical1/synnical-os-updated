<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <!-- Bird body -->
  <circle cx="120" cy="100" r="28" fill="#ec4899"/>
  <!-- Bird eye -->
  <circle cx="135" cy="92" r="6" fill="white"/>
  <circle cx="137" cy="92" r="3" fill="#0a0a0a"/>
  <!-- Bird beak -->
  <polygon points="148,100 160,96 160,104" fill="#f59e0b"/>
  <!-- Bird wing -->
  <ellipse cx="110" cy="108" rx="14" ry="8" fill="#db2777"/>
  <!-- Pipes -->
  <rect x="200" y="0" width="30" height="70" fill="#22c55e"/>
  <rect x="200" y="140" width="30" height="60" fill="#22c55e"/>
  <rect x="250" y="30" width="30" height="80" fill="#22c55e"/>
  <rect x="250" y="160" width="30" height="40" fill="#22c55e"/>
  <!-- Title -->
  <text x="160" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ec4899" text-anchor="middle" opacity="0.8">FLAPPY PINK</text>
</svg>
