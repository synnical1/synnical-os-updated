<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <!-- Grid -->
  <g stroke="#2a2a2a" stroke-width="1" fill="none">
    <rect x="100" y="40" width="120" height="120"/>
    <line x1="140" y1="40" x2="140" y2="160"/>
    <line x1="180" y1="40" x2="180" y2="160"/>
    <line x1="100" y1="80" x2="220" y2="80"/>
    <line x1="100" y1="120" x2="220" y2="120"/>
  </g>
  <!-- X marks -->
  <g stroke="#ec4899" stroke-width="4" stroke-linecap="round">
    <line x1="108" y1="48" x2="132" y2="72"/>
    <line x1="132" y1="48" x2="108" y2="72"/>
    <line x1="148" y1="88" x2="172" y2="112"/>
    <line x1="172" y1="88" x2="148" y2="112"/>
  </g>
  <!-- O marks -->
  <g stroke="#3b82f6" stroke-width="4" fill="none">
    <circle cx="200" cy="60" r="12"/>
    <circle cx="120" cy="100" r="12"/>
  </g>
  <!-- Title -->
  <text x="160" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ec4899" text-anchor="middle" opacity="0.8">TIC TAC TOE</text>
</svg>
