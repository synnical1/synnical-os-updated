<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Tic Tac Toe — Synnical</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #141414;
    --panel-2: #1a1a1a;
    --text: #e4e4e7;
    --muted: #8b8b95;
    --accent: #ec4899;
    --accent-2: #be185d;
    --x: #ec4899;
    --o: #38bdf8;
    --border: #2a2a2a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    user-select: none;
    -webkit-user-select: none;
  }
  .wrap {
    width: 100%;
    max-width: 420px;
    padding: 12px 14px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .hud { display: flex; gap: 8px; align-items: center; }
  .pill {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 56px;
    justify-content: center;
  }
  .pill b { color: var(--text); font-weight: 700; font-size: 16px; }
  .pill.x b { color: var(--x); }
  .pill.o b { color: var(--o); }
  .pill.tie b { color: var(--muted); }
  button.btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  button.btn:hover { background: var(--accent-2); }
  button.btn:active { transform: scale(0.96); }
  button.btn.ghost {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.btn.ghost:hover { background: #232323; }
  button.btn.ghost.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .status {
    width: 100%;
    text-align: center;
    font-size: 14px;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
  }
  .status b { color: var(--text); font-weight: 700; }
  .status.win b { color: var(--accent); }
  .status.tie b { color: var(--muted); }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 360px;
    padding: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    position: relative;
  }
  .cell {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.12s ease, transform 0.08s ease;
    font-size: 56px;
    font-weight: 800;
    line-height: 1;
    position: relative;
  }
  .cell:hover:not(.taken) { background: #232323; }
  .cell:active:not(.taken) { transform: scale(0.96); }
  .cell.x { color: var(--x); text-shadow: 0 0 16px rgba(236,72,153,0.55); }
  .cell.o { color: var(--o); text-shadow: 0 0 16px rgba(56,189,248,0.55); }
  .cell.taken { cursor: default; }
  .cell.win { background: rgba(236,72,153,0.18); border-color: var(--accent); }

  .controls {
    width: 100%;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .hint { font-size: 11px; color: var(--muted); text-align: center; }
  .seg {
    display: inline-flex;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    gap: 3px;
  }
  .seg button {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .seg button.on { background: var(--accent); color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title"><span class="dot"></span> Tic Tac Toe</div>
    <div class="hud">
      <div class="pill x">You <b id="pX">0</b></div>
      <div class="pill tie">Tie <b id="pT">0</b></div>
      <div class="pill o">AI <b id="pO">0</b></div>
    </div>
  </header>

  <div class="status" id="status">Your turn — you are <b style="color:var(--x)">X</b></div>

  <div class="board" id="board"></div>

  <div class="controls">
    <button class="btn" id="restartBtn">Restart</button>
    <button class="btn ghost" id="resetScoreBtn">Reset Score</button>
    <div class="seg" role="group" aria-label="AI difficulty">
      <button data-diff="easy">Easy</button>
      <button data-diff="medium" class="on">Medium</button>
      <button data-diff="hard">Hard</button>
    </div>
  </div>
  <div class="hint">Tap any empty square to place <b style="color:var(--x)">X</b>. The AI plays <b style="color:var(--o)">O</b>.</div>
</div>

<script>
(function () {
  const boardEl = document.getElementById("board");
  const statusEl = document.getElementById("status");
  const restartBtn = document.getElementById("restartBtn");
  const resetScoreBtn = document.getElementById("resetScoreBtn");
  const pXEl = document.getElementById("pX");
  const pOEl = document.getElementById("pO");
  const pTEl = document.getElementById("pT");
  const diffBtns = document.querySelectorAll(".seg button");

  const HUMAN = "X";
  const AI = "O";
  const WIN_LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6],
  ];

  let board, turn, gameOver, winLine;
  let scoreX = 0, scoreO = 0, scoreT = 0;
  let difficulty = "medium";

  function emptyBoard() { return Array(9).fill(""); }

  function init() {
    board = emptyBoard();
    turn = HUMAN;
    gameOver = false;
    winLine = null;
    render();
    setStatus("Your turn — you are <b style=\"color:var(--x)\">X</b>", false);
  }

  function render() {
    boardEl.innerHTML = "";
    for (let i = 0; i < 9; i++) {
      const c = document.createElement("div");
      c.className = "cell";
      if (board[i]) c.classList.add("taken", board[i].toLowerCase());
      if (winLine && winLine.indexOf(i) >= 0) c.classList.add("win");
      c.textContent = board[i];
      c.setAttribute("role", "button");
      c.setAttribute("aria-label", "Cell " + (i + 1) + (board[i] ? (", " + board[i]) : ", empty"));
      c.tabIndex = board[i] || gameOver ? -1 : 0;
      c.addEventListener("click", () => onCell(i));
      c.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onCell(i); }
      });
      boardEl.appendChild(c);
    }
  }

  function setStatus(html, isWin) {
    statusEl.innerHTML = html;
    statusEl.classList.toggle("win", !!isWin);
    statusEl.classList.toggle("tie", html.indexOf("Tie") >= 0);
  }

  function findWinner(b) {
    for (const line of WIN_LINES) {
      const [a, c, d] = line;
      if (b[a] && b[a] === b[c] && b[a] === b[d]) return { winner: b[a], line };
    }
    if (b.every((v) => v)) return { winner: "T", line: null };
    return null;
  }

  function onCell(i) {
    if (gameOver || board[i] || turn !== HUMAN) return;
    board[i] = HUMAN;
    turn = AI;
    render();
    const r = findWinner(board);
    if (r) { finish(r); return; }
    setStatus("AI is thinking…", false);
    setTimeout(aiMove, 320);
  }

  function aiMove() {
    if (gameOver) return;
    let move;
    if (difficulty === "easy") {
      move = randomMove(board);
    } else if (difficulty === "medium") {
      // 60% optimal, 40% random
      move = Math.random() < 0.6 ? bestMove(board, AI) : randomMove(board);
    } else {
      move = bestMove(board, AI);
    }
    if (move == null) return;
    board[move] = AI;
    turn = HUMAN;
    render();
    const r = findWinner(board);
    if (r) finish(r);
    else setStatus("Your turn — you are <b style=\"color:var(--x)\">X</b>", false);
  }

  function randomMove(b) {
    const empty = [];
    for (let i = 0; i < 9; i++) if (!b[i]) empty.push(i);
    if (!empty.length) return null;
    return empty[Math.floor(Math.random() * empty.length)];
  }

  // Minimax with alpha-beta pruning — perfect play for AI.
  function bestMove(b, player) {
    let best = -Infinity, move = null;
    for (let i = 0; i < 9; i++) {
      if (!b[i]) {
        b[i] = player;
        const score = minimax(b, player === AI ? HUMAN : AI, -Infinity, Infinity, 0);
        b[i] = "";
        if (score > best) { best = score; move = i; }
      }
    }
    return move;
  }

  function minimax(b, current, alpha, beta, depth) {
    const r = findWinner(b);
    if (r) {
      if (r.winner === AI) return 10 - depth;
      if (r.winner === HUMAN) return depth - 10;
      return 0;
    }
    if (current === AI) {
      let best = -Infinity;
      for (let i = 0; i < 9; i++) {
        if (!b[i]) {
          b[i] = AI;
          best = Math.max(best, minimax(b, HUMAN, alpha, beta, depth + 1));
          b[i] = "";
          alpha = Math.max(alpha, best);
          if (beta <= alpha) break;
        }
      }
      return best;
    } else {
      let best = Infinity;
      for (let i = 0; i < 9; i++) {
        if (!b[i]) {
          b[i] = HUMAN;
          best = Math.min(best, minimax(b, AI, alpha, beta, depth + 1));
          b[i] = "";
          beta = Math.min(beta, best);
          if (beta <= alpha) break;
        }
      }
      return best;
    }
  }

  function finish(r) {
    gameOver = true;
    winLine = r.line;
    render();
    if (r.winner === HUMAN) {
      scoreX++;
      pXEl.textContent = scoreX;
      setStatus("<b>You win!</b> 🎉", true);
    } else if (r.winner === AI) {
      scoreO++;
      pOEl.textContent = scoreO;
      setStatus("<b>AI wins.</b> Try again?", true);
    } else {
      scoreT++;
      pTEl.textContent = scoreT;
      setStatus("<b>Tie game.</b> Tap Restart to play again.", false);
    }
  }

  restartBtn.addEventListener("click", init);
  resetScoreBtn.addEventListener("click", () => {
    scoreX = scoreO = scoreT = 0;
    pXEl.textContent = "0";
    pOEl.textContent = "0";
    pTEl.textContent = "0";
    init();
  });
  diffBtns.forEach((b) => {
    b.addEventListener("click", () => {
      diffBtns.forEach((x) => x.classList.remove("on"));
      b.classList.add("on");
      difficulty = b.dataset.diff;
      init();
    });
  });

  init();
})();
</script>
</body>
</html>
