<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Mini Sudoku — Synnical</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #141414;
    --panel-2: #1a1a1a;
    --text: #e4e4e7;
    --muted: #8b8b95;
    --accent: #ec4899;
    --accent-2: #be185d;
    --danger: #ef4444;
    --good: #22c55e;
    --border: #2a2a2a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    user-select: none;
    -webkit-user-select: none;
  }
  .wrap {
    width: 100%;
    max-width: 420px;
    padding: 12px 14px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .hud { display: flex; gap: 8px; align-items: center; }
  .pill {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 56px;
    justify-content: center;
  }
  .pill b { color: var(--text); font-weight: 700; font-size: 16px; }
  .pill.accent b { color: var(--accent); }

  .status {
    width: 100%;
    text-align: center;
    font-size: 14px;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
  }
  .status b { color: var(--text); font-weight: 700; }
  .status.win { border-color: var(--good); color: var(--good); }
  .status.win b { color: var(--good); }
  .status.err { border-color: var(--danger); color: var(--danger); }

  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    width: 100%;
    max-width: 340px;
    aspect-ratio: 1 / 1;
    background: var(--border);
    gap: 1px;
    padding: 3px;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    border: 1px solid var(--border);
  }
  /* Thicker borders between 2x2 boxes */
  .cell {
    background: var(--panel-2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(28px, 9vw, 44px);
    font-weight: 700;
    cursor: pointer;
    transition: background 0.08s ease;
    position: relative;
  }
  /* Box separators — thicker right/bottom border for cells at end of a 2x2 box */
  .cell[data-c="1"] { margin-right: 2px; }
  .cell[data-c="3"] { margin-right: 0; }
  .cell[data-r="1"] { margin-bottom: 2px; }
  .cell[data-r="3"] { margin-bottom: 0; }
  .cell:hover { background: #232323; }
  .cell.given { color: var(--text); cursor: default; }
  .cell.user { color: var(--accent); }
  .cell.sel { background: rgba(236,72,153,0.25); box-shadow: inset 0 0 0 2px var(--accent); }
  .cell.peer { background: rgba(236,72,153,0.08); }
  .cell.same { background: rgba(236,72,153,0.2); }
  .cell.conflict { color: var(--danger) !important; background: rgba(239,68,68,0.18) !important; }
  .cell.win-flash { animation: winFlash 0.5s ease; }
  @keyframes winFlash {
    0% { background: rgba(34,197,94,0.5); transform: scale(1.08); }
    100% { background: var(--panel-2); transform: scale(1); }
  }

  .pad {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    width: 100%;
    max-width: 340px;
  }
  .pad button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 22px;
    font-weight: 700;
    border-radius: 10px;
    padding: 14px 0;
    cursor: pointer;
    transition: background 0.1s ease, transform 0.08s ease;
    min-height: 52px;
  }
  .pad button:hover { background: #232323; border-color: var(--accent); }
  .pad button:active { transform: scale(0.95); }
  .pad button.erase { font-size: 14px; color: var(--danger); }

  .controls {
    width: 100%;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button.btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  button.btn:hover { background: var(--accent-2); }
  button.btn:active { transform: scale(0.96); }
  button.btn.ghost {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.btn.ghost:hover { background: #232323; }

  .hint { font-size: 11px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title"><span class="dot"></span> Mini Sudoku</div>
    <div class="hud">
      <div class="pill accent">Filled <b id="filled">0</b>/16</div>
      <div class="pill">Mistakes <b id="mistakes">0</b></div>
    </div>
  </header>

  <div class="status" id="status">Fill every row, column and 2×2 box with <b>1–4</b>.</div>

  <div class="board" id="board" role="grid" aria-label="Sudoku board"></div>

  <div class="pad" id="pad">
    <button data-n="1">1</button>
    <button data-n="2">2</button>
    <button data-n="3">3</button>
    <button data-n="4">4</button>
    <button class="erase" data-n="0">Erase</button>
  </div>

  <div class="controls">
    <button class="btn" id="newBtn">New Puzzle</button>
    <button class="btn ghost" id="resetBtn">Reset Input</button>
    <button class="btn ghost" id="hintBtn">Hint</button>
  </div>
  <div class="hint">Tap a cell, then tap a number. Each row, column, and 2×2 box must contain 1, 2, 3, 4 exactly once.</div>
</div>

<script>
(function () {
  const boardEl = document.getElementById("board");
  const padEl = document.getElementById("pad");
  const statusEl = document.getElementById("status");
  const newBtn = document.getElementById("newBtn");
  const resetBtn = document.getElementById("resetBtn");
  const hintBtn = document.getElementById("hintBtn");
  const filledEl = document.getElementById("filled");
  const mistakesEl = document.getElementById("mistakes");

  // Base valid 4x4 solution.
  const BASE = [
    [1,2,3,4],
    [3,4,1,2],
    [2,1,4,3],
    [4,3,2,1],
  ];

  let solution;   // 4x4 ints — the complete valid answer
  let givens;     // 4x4 booleans — true if cell is pre-filled (immutable)
  let user;       // 4x4 ints (0 = empty) — user-entered values
  let selected;   // {r, c} | null
  let mistakes;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Build a randomized valid solution by applying digit permutation +
  // row/column band swaps to the base solution. All these preserve validity.
  function genSolution() {
    // Digit permutation: 1..4 → some reordering
    const perm = shuffle([1,2,3,4]);
    let s = BASE.map((row) => row.map((v) => perm[v - 1]));
    // Swap the two row bands (rows 0-1 ↔ rows 2-3)
    if (Math.random() < 0.5) { const t = s.slice(0, 2); s = s.slice(2, 4).concat(t); }
    // Swap rows within band 1
    if (Math.random() < 0.5) { [s[0], s[1]] = [s[1], s[0]]; }
    // Swap rows within band 2
    if (Math.random() < 0.5) { [s[2], s[3]] = [s[3], s[2]]; }
    // Transpose for column swaps: do the same on columns
    let t = s[0].map((_, c) => s.map((row) => row[c]));
    if (Math.random() < 0.5) { const u = t.slice(0, 2); t = t.slice(2, 4).concat(u); }
    if (Math.random() < 0.5) { [t[0], t[1]] = [t[1], t[0]]; }
    if (Math.random() < 0.5) { [t[2], t[3]] = [t[3], t[2]]; }
    s = t[0].map((_, r) => t.map((row) => row[r]));
    return s;
  }

  function genPuzzle() {
    solution = genSolution();
    givens = Array.from({ length: 4 }, () => Array(4).fill(false));
    user = Array.from({ length: 4 }, () => Array(4).fill(0));
    // Easy: ~8 givens (remove 8 of 16). Always solvable by logic.
    const cells = [];
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) cells.push({ r, c });
    shuffle(cells);
    const removeCount = 8;
    for (let i = 0; i < removeCount; i++) {
      const { r, c } = cells[i];
      // leave as empty (not given)
    }
    for (let i = removeCount; i < 16; i++) {
      const { r, c } = cells[i];
      givens[r][c] = true;
      user[r][c] = solution[r][c];
    }
    selected = null;
    mistakes = 0;
    mistakesEl.textContent = "0";
    render();
    setStatus("Fill every row, column and 2×2 box with <b>1–4</b>.");
  }

  function boxIndex(r, c) { return Math.floor(r / 2) * 2 + Math.floor(c / 2); }

  function findConflicts() {
    // Returns a Set of "r,c" strings for cells that conflict with another cell.
    const conflicts = new Set();
    // Rows
    for (let r = 0; r < 4; r++) {
      const seen = {};
      for (let c = 0; c < 4; c++) {
        const v = user[r][c];
        if (!v) continue;
        if (seen[v] !== undefined) {
          conflicts.add(r + "," + c);
          conflicts.add(r + "," + seen[v]);
        } else seen[v] = c;
      }
    }
    // Columns
    for (let c = 0; c < 4; c++) {
      const seen = {};
      for (let r = 0; r < 4; r++) {
        const v = user[r][c];
        if (!v) continue;
        if (seen[v] !== undefined) {
          conflicts.add(r + "," + c);
          conflicts.add(seen[v] + "," + c);
        } else seen[v] = r;
      }
    }
    // 2x2 boxes
    for (let br = 0; br < 2; br++) for (let bc = 0; bc < 2; bc++) {
      const seen = {};
      for (let dr = 0; dr < 2; dr++) for (let dc = 0; dc < 2; dc++) {
        const r = br * 2 + dr, c = bc * 2 + dc;
        const v = user[r][c];
        if (!v) continue;
        if (seen[v]) {
          conflicts.add(r + "," + c);
          conflicts.add(seen[v]);
        } else seen[v] = r + "," + c;
      }
    }
    return conflicts;
  }

  function isComplete() {
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (!user[r][c]) return false;
    return findConflicts().size === 0;
  }

  function countFilled() {
    let n = 0;
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (user[r][c]) n++;
    return n;
  }

  function render() {
    boardEl.innerHTML = "";
    const conflicts = findConflicts();
    const selVal = selected ? user[selected.r][selected.c] : 0;
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.r = r;
        cell.dataset.c = c;
        cell.setAttribute("role", "gridcell");
        const v = user[r][c];
        if (v) {
          cell.textContent = v;
          cell.classList.add(givens[r][c] ? "given" : "user");
        }
        if (selected) {
          if (selected.r === r && selected.c === c) cell.classList.add("sel");
          else if (selected.r === r || selected.c === c || boxIndex(selected.r, selected.c) === boxIndex(r, c)) cell.classList.add("peer");
          else if (selVal && v === selVal) cell.classList.add("same");
        }
        if (conflicts.has(r + "," + c)) cell.classList.add("conflict");
        cell.addEventListener("click", () => onSelect(r, c));
        boardEl.appendChild(cell);
      }
    }
    filledEl.textContent = countFilled();
  }

  function setStatus(html, cls) {
    statusEl.innerHTML = html;
    statusEl.className = "status" + (cls ? " " + cls : "");
  }

  function onSelect(r, c) {
    selected = { r, c };
    render();
  }

  function place(n) {
    if (!selected) { setStatus("Tap a cell first, then tap a number.", "err"); return; }
    const { r, c } = selected;
    if (givens[r][c]) { setStatus("That cell is pre-filled.", "err"); return; }
    const prev = user[r][c];
    user[r][c] = n;
    if (n && n !== solution[r][c] && prev !== n) {
      // Wrong number placed (not just a duplicate) — count as a mistake
      // (but only if it's actually incorrect vs the unique solution)
      mistakes++;
      mistakesEl.textContent = mistakes;
    }
    render();
    if (isComplete()) {
      setStatus("<b>Solved!</b> 🎉 Nicely done.", "win");
      // Win animation
      const cells = boardEl.querySelectorAll(".cell");
      cells.forEach((cell, i) => {
        setTimeout(() => cell.classList.add("win-flash"), i * 60);
      });
    } else {
      const conflicts = findConflicts();
      if (conflicts.size > 0) setStatus("Conflict — check the red cells.", "err");
      else setStatus("Looking good. Keep going.", "");
    }
  }

  // Number pad
  padEl.querySelectorAll("button").forEach((b) => {
    b.addEventListener("click", () => place(parseInt(b.dataset.n, 10)));
  });

  // Keyboard input
  window.addEventListener("keydown", (e) => {
    if (e.key >= "1" && e.key <= "4") { place(parseInt(e.key, 10)); }
    else if (e.key === "0" || e.key === "Backspace" || e.key === "Delete") { place(0); }
    else if (e.key === "ArrowUp" && selected) { selected.r = Math.max(0, selected.r - 1); render(); }
    else if (e.key === "ArrowDown" && selected) { selected.r = Math.min(3, selected.r + 1); render(); }
    else if (e.key === "ArrowLeft" && selected) { selected.c = Math.max(0, selected.c - 1); render(); }
    else if (e.key === "ArrowRight" && selected) { selected.c = Math.min(3, selected.c + 1); render(); }
  });

  newBtn.addEventListener("click", genPuzzle);
  resetBtn.addEventListener("click", () => {
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      if (!givens[r][c]) user[r][c] = 0;
    }
    mistakes = 0;
    mistakesEl.textContent = "0";
    render();
    setStatus("Cleared your input. Givens kept.", "");
  });
  hintBtn.addEventListener("click", () => {
    // Fill one empty cell with its correct value.
    const empty = [];
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (!user[r][c]) empty.push({ r, c });
    if (!empty.length) { setStatus("Nothing to hint — board is full.", "err"); return; }
    const pick = empty[Math.floor(Math.random() * empty.length)];
    user[pick.r][pick.c] = solution[pick.r][pick.c];
    selected = pick;
    render();
    if (isComplete()) setStatus("<b>Solved!</b> 🎉", "win");
    else setStatus("Hint placed at " + String.fromCharCode(65 + pick.c) + (4 - pick.r) + ".", "");
  });

  genPuzzle();
})();
</script>
</body>
</html>
