name: Deploy Synnical

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep PR runs serialized/cancellable, but give every main push its own
  # deployment slot so a completed deploy with a stuck post-deploy artifact
  # upload cannot block all later releases.
  group: synnical-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain for the Rust-backed smoke service
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format, test and build Rust chat for the smoke suite
        run: |
          cargo fmt --manifest-path rust/synnical-chat/Cargo.toml
          cargo fmt --manifest-path rust/synnical-chat/Cargo.toml -- --check
          cargo test --manifest-path rust/synnical-chat/Cargo.toml
          cargo build --manifest-path rust/synnical-chat/Cargo.toml

      - name: Install dependencies
        run: npm ci --include=dev --include=optional

      - name: Create isolated CI database
        env:
          DATABASE_URL: file:./prisma/ci.db
        run: npm run db:init

      - name: Verify proxy assets
        run: npm run check:proxy

      - name: Validate Roblox Nginx setup script
        run: bash -n deploy/configure-roblox-host.sh

      - name: Validate, test, and build
        env:
          DATABASE_URL: file:./prisma/ci.db
        run: npm run release:gate

      - name: Run production smoke suite
        env:
          DATABASE_URL: file:./prisma/ci.db
          SYNNICAL_DESKTOP_BROWSER_TEST: "true"
          SYNNICAL_LAYOUT_EVIDENCE_DIR: pr-layout-evidence
        run: npm run test:smoke

      - name: Run single-core production smoke regression
        env:
          DATABASE_URL: file:./prisma/ci.db
        run: |
          smoke_cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[-,]/); print cpus[1] }' /proc/self/status)"
          taskset --cpu-list "$smoke_cpu" npm run test:smoke

      - name: Preserve verified browser layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-desktop-layout
          path: pr-layout-evidence
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy to Oracle ARM64
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEPLOY_HOST: 140.238.87.247
      DEPLOY_USER: ubuntu
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.SYNNICAL_DEPLOY_SSH_KEY }}

    steps:
      - name: Require deployment key
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          if [ -z "$DEPLOY_SSH_PRIVATE_KEY" ]; then
            echo "::error::Missing repository secret SYNNICAL_DEPLOY_SSH_KEY."
            exit 1
          fi
          if [ -z "$TMDB_READ_ACCESS_TOKEN" ]; then
            echo "::error::Missing repository secret TMDB_READ_ACCESS_TOKEN. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Configure SSH
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Stage TMDB token securely on the deployment host
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          stage_path="/home/$DEPLOY_USER/.synnical-tmdb-token-${GITHUB_RUN_ID}"
          umask 077
          printf '%s' "$TMDB_READ_ACCESS_TOKEN" > "$RUNNER_TEMP/tmdb-token"
          scp -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "$RUNNER_TEMP/tmdb-token" "$DEPLOY_USER@$DEPLOY_HOST:$stage_path"
          rm -f "$RUNNER_TEMP/tmdb-token"

      - name: Deploy exact pushed commit
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n install -o synnical -g synnical -m 600 '/home/$DEPLOY_USER/.synnical-tmdb-token-${GITHUB_RUN_ID}' '/var/lib/synnical/.tmdb-token-${GITHUB_RUN_ID}' && rm -f '/home/$DEPLOY_USER/.synnical-tmdb-token-${GITHUB_RUN_ID}' && sudo -n -u synnical -H bash -s -- '$DEPLOY_SHA' '/var/lib/synnical/.tmdb-token-${GITHUB_RUN_ID}'" <<'REMOTE'
          set -Eeuo pipefail

          deploy_sha="$1"
          tmdb_secret_file="$2"
          app_dir="/var/www/synnical"
          cleanup_tmdb_secret() { rm -f "$tmdb_secret_file"; }
          trap cleanup_tmdb_secret EXIT

          lock_file="/tmp/synnical-deploy.lock"

          exec 9>"$lock_file"
          if ! flock -n 9; then
            echo "Another Synnical deployment is already running." >&2
            exit 75
          fi

          # Inject the GitHub Actions secret into the private server-side .env.
          # Never echo the value, put it in argv, or commit it to the repository.
          TMDB_SECRET_FILE="$tmdb_secret_file" node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const secretPath = process.env.TMDB_SECRET_FILE
          const token = fs.readFileSync(secretPath, 'utf8').trim()
          if (!token || /[\r\n]/.test(token)) throw new Error('TMDB secret is empty or malformed')
          const envPath = '/var/www/synnical/.env'
          let contents = fs.readFileSync(envPath, 'utf8')
          const line = 'TMDB_READ_ACCESS_TOKEN=' + JSON.stringify(token)
          if (/^TMDB_READ_ACCESS_TOKEN=.*$/m.test(contents)) {
            contents = contents.replace(/^TMDB_READ_ACCESS_TOKEN=.*$/m, line)
          } else {
            contents = contents.replace(/\s*$/, '') + '\n' + line + '\n'
          }
          const temporaryPath = envPath + '.tmdb.tmp'
          fs.writeFileSync(temporaryPath, contents, { mode: 0o600 })
          fs.chmodSync(temporaryPath, 0o600)
          fs.renameSync(temporaryPath, envPath)
          NODE
          cd "$app_dir"
          git fetch --no-tags origin main
          git cat-file -e "$deploy_sha^{commit}"
          git reset --hard "$deploy_sha"

          # Compile the Rust chat sidecar before the Next.js routes use it.
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          source "$HOME/.cargo/env"
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt --toolchain stable
          cargo fmt --manifest-path rust/synnical-chat/Cargo.toml
          cargo test --manifest-path rust/synnical-chat/Cargo.toml
          cargo build --release --manifest-path rust/synnical-chat/Cargo.toml

          npm ci --include=dev --include=optional
          node scripts/runtime-preflight.mjs
          npx prisma generate
          npm run db:init
          npm run build
          # Keep the large Roblox WebClientApp out of Git; provision it only when absent.
          node scripts/fetch-webblox.mjs --if-missing
          SYNNICAL_RUST_CHAT_BINARY="$app_dir/rust/synnical-chat/target/release/synnical-chat" npm run test:smoke

          # Wallpaper uploads and saved preferences are persistent user data.
          # Deployments must never delete wallpaper files or reset wallpaper selections.

          reload_started_ms="$(node -p 'Date.now()')"
          pm2 startOrReload ecosystem.config.cjs --update-env
          pm2 save

          # Inspect only release metadata; never print PM2's environment/secrets.
          pm2 jlist | node -e '
            const fs = require("node:fs");
            const { execFileSync } = require("node:child_process");
            let input = "";
            process.stdin.on("data", chunk => { input += chunk });
            process.stdin.on("end", () => {
              const apps = JSON.parse(input);
              const app = apps.find(row => row.name === "synnical");
              const rust = apps.find(row => row.name === "synnical-rust-chat");
              if (!app || app.pm2_env.status !== "online" || !app.pid) throw new Error("Synnical is not online under PM2");
              if (!rust || rust.pm2_env.status !== "online" || !rust.pid) throw new Error("Rust chat sidecar is not online under PM2");
              if (fs.realpathSync(app.pm2_env.pm_cwd) !== fs.realpathSync(process.cwd())) throw new Error("PM2 uses a different application checkout");
              if (!(app.pm2_env.pm_uptime >= Number(process.argv[2]))) throw new Error("Synnical did not restart for this deployment");
              if (!(rust.pm2_env.pm_uptime >= Number(process.argv[2]))) throw new Error("Rust chat did not restart for this deployment");
              const commit = execFileSync("git", ["rev-parse", "HEAD"], { cwd: app.pm2_env.pm_cwd, encoding: "utf8" }).trim();
              if (commit !== process.argv[1]) throw new Error("PM2 checkout does not match deployment SHA");
              console.log(JSON.stringify({ apps: [app, rust].map(row => ({ app: row.name, status: row.pm2_env.status, pid: row.pid })), commit }));
            });
          ' "$deploy_sha" "$reload_started_ms"

          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/api >/dev/null &&
               curl --fail --silent --show-error --max-time 5 http://127.0.0.1:4401/health >/dev/null; then
              if node scripts/runtime-preflight.mjs --runtime; then
                git rev-parse --verify HEAD
                echo "Synnical application deployment completed. Games readiness is reported separately above."
                exit 0
              fi
            fi
            sleep 2
          done

          echo "Synnical or bundled Stratus did not become healthy after deployment." >&2
          exit 1
          REMOTE

      - name: Configure Roblox hostname and HTTPS
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n bash /var/www/synnical/deploy/configure-roblox-host.sh"

      - name: Check out deployed commit for visual verification
        uses: actions/checkout@v4

      - name: Use Node.js 22 for live visual verification
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install browser verification dependencies
        run: npm ci --include=dev --include=optional

      - name: Verify live desktop rendering
        env:
          SYNNICAL_LAYOUT_EVIDENCE_DIR: live-layout-evidence
        run: node scripts/desktop-browser-regression.mjs https://www.synnical.co.uk

      - name: Preserve live visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-desktop-layout
          path: live-layout-evidence
          if-no-files-found: ignore
          retention-days: 7
