name: Deploy Synnical

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synnical-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --include=optional

      - name: Create isolated CI database
        env:
          DATABASE_URL: file:./prisma/ci.db
        run: npm run db:init

      - name: Verify proxy assets
        run: npm run check:proxy

      - name: Validate, test, and build
        env:
          DATABASE_URL: file:./prisma/ci.db
        run: npm run release:gate

      - name: Run production smoke suite
        env:
          DATABASE_URL: file:./prisma/ci.db
        run: npm run test:smoke

      - name: Run single-core production smoke regression
        env:
          DATABASE_URL: file:./prisma/ci.db
        run: |
          smoke_cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[-,]/); print cpus[1] }' /proc/self/status)"
          taskset --cpu-list "$smoke_cpu" npm run test:smoke

  deploy:
    name: Deploy to Oracle ARM64
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEPLOY_HOST: 140.238.87.247
      DEPLOY_USER: ubuntu
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.SYNNICAL_DEPLOY_SSH_KEY }}

    steps:
      - name: Require deployment key
        run: |
          if [ -z "$DEPLOY_SSH_PRIVATE_KEY" ]; then
            echo "::error::Missing repository secret SYNNICAL_DEPLOY_SSH_KEY."
            exit 1
          fi

      - name: Configure SSH
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Deploy exact pushed commit
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n -u synnical -H bash -s -- '$DEPLOY_SHA'" <<'REMOTE'
          set -Eeuo pipefail

          deploy_sha="$1"
          app_dir="/var/www/synnical"
          lock_file="/tmp/synnical-deploy.lock"

          exec 9>"$lock_file"
          if ! flock -n 9; then
            echo "Another Synnical deployment is already running." >&2
            exit 75
          fi

          cd "$app_dir"
          git fetch --no-tags origin main
          git cat-file -e "$deploy_sha^{commit}"
          git reset --hard "$deploy_sha"

          npm ci --include=dev --include=optional
          npx prisma generate
          npm run db:init
          npm run build
          npm run test:smoke

          reload_started_ms="$(node -p 'Date.now()')"
          pm2 reload synnical --update-env
          pm2 save

          # Inspect only release metadata; never print PM2's environment/secrets.
          pm2 jlist | node -e '
            const fs = require("node:fs");
            const { execFileSync } = require("node:child_process");
            let input = "";
            process.stdin.on("data", chunk => { input += chunk });
            process.stdin.on("end", () => {
              const app = JSON.parse(input).find(row => row.name === "synnical");
              if (!app || app.pm2_env.status !== "online" || !app.pid) throw new Error("Synnical is not online under PM2");
              if (fs.realpathSync(app.pm2_env.pm_cwd) !== fs.realpathSync(process.cwd())) throw new Error("PM2 uses a different application checkout");
              if (!(app.pm2_env.pm_uptime >= Number(process.argv[2]))) throw new Error("PM2 did not restart for this deployment");
              const commit = execFileSync("git", ["rev-parse", "HEAD"], { cwd: app.pm2_env.pm_cwd, encoding: "utf8" }).trim();
              if (commit !== process.argv[1]) throw new Error("PM2 checkout does not match deployment SHA");
              console.log(JSON.stringify({ app: app.name, status: app.pm2_env.status, pid: app.pid, commit }));
            });
          ' "$deploy_sha" "$reload_started_ms"

          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/api >/dev/null; then
              if node -e 'Promise.all([
                fetch("http://127.0.0.1:3000/api/games/cloud/v1/health").then(async r => { if (!r.ok) throw new Error("Stratus health HTTP " + r.status); const body = await r.json(); if (body.status !== "ok" || body.service !== "stratus") throw new Error("Invalid Stratus health response") }),
                fetch("http://127.0.0.1:3000/api/games/cloud/v1/games").then(async r => { if (!r.ok) throw new Error("Stratus catalog HTTP " + r.status); const body = await r.json(); if (!Array.isArray(body) || body.length < 200 || typeof body[0]?.game_key !== "string") throw new Error("Invalid Stratus catalog") }),
              ]).catch(error => { console.error(error); process.exit(1) })'; then
                git rev-parse --verify HEAD
                echo "Synnical + bundled Stratus deployment completed."
                exit 0
              fi
            fi
            sleep 2
          done

          echo "Synnical or bundled Stratus did not become healthy after deployment." >&2
          exit 1
          REMOTE
